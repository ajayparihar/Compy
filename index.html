<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 
        Author: Ajay Singh
        Version: 1.1
        Original Date: 11-09-2023
        Updated Date: 25-02-2025
        Description: Main HTML file for the Command Management System
        
        WARNING: This HTML structure is carefully crafted.
        Future me: Remember when you "simplified" the header and broke the entire layout?
        Let's not do that again. Each div has a purpose, I promise.
    -->
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Compy</title>

    <!-- Favicon links - because every app needs a pretty icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- Stylesheets - the order matters here! -->
    <!-- Google Fonts first, then our custom styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="toast.css">
</head>

<body>
    <!-- 
        Header Section - Fixed at the top of the page
        Contains the app title, search bar, and theme selector
        This is the command center for the user
    -->
    <div class="header-section">
        <header>
            <h1 id="pageTitle">COMPY</h1>
            <div id="user-display"></div>
            <!-- Search container with input and clear button -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Type to search..." aria-label="Search commands">
                <div id="clearSearch" class="clear-icon" aria-label="Clear search" role="button" tabindex="0"
                    style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"
                        fill="currentColor">
                        <path
                            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                    </svg>
                </div>
            </div>
            <!-- Header controls for theme selection -->
            <div class="header-controls">
                <div class="theme-selector">
                    <select id="themeSelect" aria-label="Select theme">
                        <option value="d1">Mystic Forest</option>
                        <option value="d2">Crimson Night</option>
                        <option value="d3">Royal Elegance</option>
                        <option value="d4">Galactic Blue</option>
                        <option value="d5">Twilight Dream</option>
                        <option value="d6">Deep Ocean</option>
                        <option value="d7">Cyber Night</option>
                        <option value="d8">Molten Core</option>
                        <option value="d9">Neon Pulse</option>
                        <option value="d10">Toxic Night</option>
                        <option value="l1">Sunrise</option>
                        <option value="l2">Soft Glow</option>
                        <option value="l3">Floral Breeze</option>
                        <option value="l4">Ocean Breeze</option>
                        <option value="l5">Golden Sands</option>
                        <option value="l6">Mint Grove</option>
                        <option value="l7">Sky Dusk</option>
                        <option value="l8">Autumn Leaves</option>
                        <option value="l9">Citrus Burst</option>
                        <option value="l10">Rose Petal</option>
                        <option value="l11">Lavender Mist</option>
                    </select>
                </div>
            </div>
        </header>
    </div>

    <!-- Error message container -->
    <div class="error-message" style="display: none;">
        <p>Could not load data file</p>
        <button id="retry-button">Retry</button>
    </div>

    <!-- Main content area -->
    <main>
        <div id="data-container" aria-live="polite" role="region" aria-label="Command list">
            <!-- Command items will be populated here with class="command-item" -->
        </div>
    </main>

    <!-- Toast notification for user feedback -->
    <div class="toast-notification" id="toast" role="alert" aria-hidden="true"></div>
    
    <!-- Loading overlay with spinner -->
    <div class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <script src="script.js"></script>
    <script src="config.js"></script>
</body>

</html>
